{% extends "base.html" %}
{% block title %}修改密码 - 乡村智能问答系统{% endblock %}
{% block content %}
<div class="container" style="max-width:480px;">
  <div class="card">
    <div class="page-title">{{ '首次登录，请先修改初始密码' if initial else '修改密码' }}</div>
    <div class="page-sub">修改成功后自动进入系统；修改前仅能访问本页。</div>
    <label class="f"><b>原密码{% if initial %}（管理员下发的初始密码）{% endif %}</b>
      <input type="password" id="old_pw" autocomplete="current-password">
    </label>
    <label class="f"><b>新密码（至少 8 位）</b>
      <input type="password" id="new_pw" autocomplete="new-password">
    </label>
    <label class="f"><b>确认新密码</b>
      <input type="password" id="new_pw2" autocomplete="new-password">
    </label>
    <div id="err" style="display:none; color:var(--danger); font-size:13px; margin-bottom:10px;"></div>
    <button class="btn primary" style="width:100%;" id="btnSave" onclick="doSave()">确认修改</button>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
async function doSave() {
  var err = document.getElementById('err');
  err.style.display = 'none';
  if (new_pw.value.length < 8) { err.textContent = '新密码至少 8 位'; err.style.display = 'block'; return; }
  if (new_pw.value !== new_pw2.value) { err.textContent = '两次输入的新密码不一致'; err.style.display = 'block'; return; }
  var btn = document.getElementById('btnSave');
  btn.disabled = true; btn.textContent = '提交中…';
  try {
    await api('/api/auth/change-password', 'POST', { old_password: old_pw.value, new_password: new_pw.value });
    toast('密码修改成功');
    setTimeout(function () { location.href = '/'; }, 600);
  } catch (e) {
    err.textContent = e.message; err.style.display = 'block';
    btn.disabled = false; btn.textContent = '确认修改';
  }
}
</script>
{% endblock %}
